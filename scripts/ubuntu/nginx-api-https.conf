# Replace __PUBLIC_IPV4__ with the IPv4 in the fabrica-api certificate.
server {
    listen 80;
    server_name __PUBLIC_IPV4__;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/fabrica-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://__PUBLIC_IPV4__$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name __PUBLIC_IPV4__;
    server_tokens off;
    client_max_body_size 64k;

    ssl_certificate /etc/letsencrypt/live/fabrica-api/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fabrica-api/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    location = / {
        return 302 /docs/;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
