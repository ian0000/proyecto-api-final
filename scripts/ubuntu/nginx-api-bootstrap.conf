# Replace __PUBLIC_IPV4__ with this VM's current public IPv4 address.
# HTTP exposes only the ACME challenge until a trusted certificate exists.
server {
    listen 80;
    server_name __PUBLIC_IPV4__;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/fabrica-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
