name: Azure frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'eslint.config.*'
      - '.github/workflows/azure-static-web-apps-thankful-pebble-0ac084b0f.yml'

permissions:
  contents: read

concurrency:
  group: azure-frontend-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm exec eslint -- frontend --max-warnings 0
      - run: npm run test --workspace frontend
      - run: npm run build:azure --workspace frontend
        env:
          VITE_API_URL: https://18.117.111.251
      - name: Publish frontend artifact to Azure
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_THANKFUL_PEBBLE_0AC084B0F }}
          action: upload
          app_location: frontend/dist
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true
